name: Build APK
run-name: "RaceNav ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing keystore
        run: |
          set -euo pipefail
          test -f ./racenav.keystore
          cp ./racenav.keystore /tmp/racenav-release.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version metadata
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$(node -e 'const c=require("./changelog.json"); const version=process.argv[1]; const entry=(c.stable||[]).find((item)=>item.version===version); if (!entry || !entry.versionCode) { console.error(`stable ${version} is missing versionCode in changelog.json`); process.exit(1); } console.log(entry.versionCode);' "$VERSION_NAME")"
          else
            VERSION_NAME="$(node -e 'const text=require("fs").readFileSync("app/build.gradle.kts","utf8"); const match=text.match(/appVersionName\s*=\s*secretProperty\("RACENAV_VERSION_NAME"\)\s*\?:\s*"([^"]+)"/); if (!match) process.exit(1); console.log(match[1]);')"
            VERSION_CODE="$(node -e 'const text=require("fs").readFileSync("app/build.gradle.kts","utf8"); const match=text.match(/appVersionCode\s*=\s*secretProperty\("RACENAV_VERSION_CODE"\)\?\.toIntOrNull\(\)\s*\?:\s*(\d+)/); if (!match) process.exit(1); console.log(match[1]);')"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          RACENAV_VERSION_NAME: ${{ steps.version.outputs.name }}
          RACENAV_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: /tmp/racenav-release.jks
          KEY_ALIAS: racenav
          KEY_PASSWORD: racenav123
          STORE_PASSWORD: racenav123
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             ./racenav-v${{ steps.version.outputs.name }}.apk
          cp app/build/outputs/apk/release/app-release.apk \
             ./racenav.apk
          cp app/build/outputs/apk/release/app-release.apk \
             ./racenav-beta.apk

      - name: Prepare beta manifest
        if: github.ref == 'refs/heads/main'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          node scripts/generate-update-manifest.js \
            --channel beta \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --apk-url "https://trophynav.ru/updates/racenav-beta.apk" \
            --output ./latest-beta.json

      - name: Prepare stable manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          node scripts/generate-update-manifest.js \
            --channel stable \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --apk-url "https://trophynav.ru/updates/racenav.apk" \
            --output ./latest.json

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: RaceNav-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          path: ./racenav-v${{ steps.version.outputs.name }}.apk
          retention-days: 14

      - name: Validate beta deploy secrets
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"

      - name: Upload beta staging bundle (main only)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          overwrite: true
          source: ./racenav-beta.apk,./latest-beta.json
          target: /tmp/racenav-beta-deploy-${{ github.run_id }}/

      - name: Publish beta on DE2 (main only)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_NAME,VERSION_CODE,RUN_ID
          script: |
            set -euo pipefail
            STAGE="/tmp/racenav-beta-deploy-${RUN_ID}"
            APK_STAGE="${STAGE}/racenav-beta.apk"
            JSON_STAGE="${STAGE}/latest-beta.json"
            TS="$(date +%Y%m%d-%H%M%S)"
            APK_VERSIONED="/var/www/updates/releases/racenav-beta-v${VERSION_NAME}.apk"
            JSON_VERSIONED="/var/www/updates/releases/latest-beta-v${VERSION_NAME}.json"

            test -f "${APK_STAGE}"
            test -f "${JSON_STAGE}"
            mkdir -p /var/www/updates/releases

            if [ -f /var/www/updates/racenav-beta.apk ]; then
              cp -f /var/www/updates/racenav-beta.apk "/var/www/updates/releases/racenav-beta.apk.bak-${TS}"
            fi
            if [ -f /var/www/updates/latest-beta.json ]; then
              cp -f /var/www/updates/latest-beta.json "/var/www/updates/releases/latest-beta.json.bak-${TS}"
            fi

            install -m 0644 "${APK_STAGE}" "${APK_VERSIONED}"
            install -m 0644 "${JSON_STAGE}" "${JSON_VERSIONED}"
            cp -f "${APK_VERSIONED}" /var/www/updates/racenav-beta.apk
            cp -f "${JSON_VERSIONED}" /var/www/updates/latest-beta.json

            curl -k -fsSL https://trophynav.ru/api/update/beta | grep -q "\"versionName\":\"${VERSION_NAME}\""
            curl -k -I -fsSL https://trophynav.ru/updates/racenav-beta.apk | grep -qi '^HTTP/.* 200'
            rm -rf "${STAGE}"

      - name: Validate stable deploy secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"

      - name: Upload stable staging bundle (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          overwrite: true
          source: ./racenav.apk,./latest.json
          target: /tmp/racenav-stable-deploy-${{ github.run_id }}/

      - name: Publish stable on DE2 (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/ssh-action@v1
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_NAME,VERSION_CODE,RUN_ID
          script: |
            set -euo pipefail
            STAGE="/tmp/racenav-stable-deploy-${RUN_ID}"
            APK_STAGE="${STAGE}/racenav.apk"
            JSON_STAGE="${STAGE}/latest.json"
            TS="$(date +%Y%m%d-%H%M%S)"
            APK_VERSIONED="/var/www/updates/releases/racenav-v${VERSION_NAME}.apk"
            JSON_VERSIONED="/var/www/updates/releases/latest-v${VERSION_NAME}.json"

            test -f "${APK_STAGE}"
            test -f "${JSON_STAGE}"
            mkdir -p /var/www/updates/releases

            if [ -f /var/www/updates/racenav.apk ]; then
              cp -f /var/www/updates/racenav.apk "/var/www/updates/releases/racenav.apk.bak-${TS}"
            fi
            if [ -f /var/www/updates/latest.json ]; then
              cp -f /var/www/updates/latest.json "/var/www/updates/releases/latest.json.bak-${TS}"
            fi

            install -m 0644 "${APK_STAGE}" "${APK_VERSIONED}"
            install -m 0644 "${JSON_STAGE}" "${JSON_VERSIONED}"
            cp -f "${APK_VERSIONED}" /var/www/updates/racenav.apk
            cp -f "${JSON_VERSIONED}" /var/www/updates/latest.json

            curl -k -fsSL https://trophynav.ru/updates/latest.json | grep -q "\"versionName\":\"${VERSION_NAME}\""
            curl -k -I -fsSL https://trophynav.ru/updates/racenav.apk | grep -qi '^HTTP/.* 200'
            rm -rf "${STAGE}"

      - name: Create GitHub Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Trophy Navigator ${{ github.ref_name }}
          files: |
            ./racenav-v${{ steps.version.outputs.name }}.apk
            ./latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
