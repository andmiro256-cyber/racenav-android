name: Build APK
run-name: "RaceNav ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/racenav-release.jks

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/racenav-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version metadata
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n1 | grep -oP '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n1 | grep -oP '\d+')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             ./racenav-v${{ steps.version.outputs.name }}.apk
          cp app/build/outputs/apk/release/app-release.apk \
             ./racenav-beta.apk

      - name: Prepare beta manifest
        if: github.ref == 'refs/heads/main'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          NOTES=$(printf '%s' "${HEAD_COMMIT_MESSAGE:-Beta build from main.}" \
            | tr '\r\n' '  ' \
            | sed 's/[[:space:]]\+/ /g' \
            | sed 's/^ //; s/ $//')
          if [ -z "$NOTES" ]; then
            NOTES="Beta build from main."
          fi
          NOTES="Beta: $NOTES"
          jq -n \
            --arg version "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg notes "$NOTES" \
            '{
              version: $version,
              versionName: $version,
              versionCode: $versionCode,
              url: "https://trophynav.ru/updates/racenav-beta.apk",
              apkUrl: "https://trophynav.ru/updates/racenav-beta.apk",
              notes: $notes,
              changelog: $notes
            }' > ./latest-beta.json

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: RaceNav-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          path: ./racenav-v${{ steps.version.outputs.name }}.apk
          retention-days: 14

      - name: Validate beta deploy secrets
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"

      - name: Upload beta staging bundle (main only)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          overwrite: true
          source: ./racenav-beta.apk,./latest-beta.json
          target: /tmp/racenav-beta-deploy-${{ github.run_id }}/

      - name: Publish beta on DE2 (main only)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION_NAME,VERSION_CODE,RUN_ID
          script: |
            set -euo pipefail
            STAGE="/tmp/racenav-beta-deploy-${RUN_ID}"
            APK_STAGE="${STAGE}/racenav-beta.apk"
            JSON_STAGE="${STAGE}/latest-beta.json"
            TS="$(date +%Y%m%d-%H%M%S)"
            APK_VERSIONED="/var/www/updates/releases/racenav-beta-v${VERSION_NAME}.apk"
            JSON_VERSIONED="/var/www/updates/releases/latest-beta-v${VERSION_NAME}.json"

            test -f "${APK_STAGE}"
            test -f "${JSON_STAGE}"
            mkdir -p /var/www/updates/releases

            if [ -f /var/www/updates/racenav-beta.apk ]; then
              cp -f /var/www/updates/racenav-beta.apk "/var/www/updates/releases/racenav-beta.apk.bak-${TS}"
            fi
            if [ -f /var/www/updates/latest-beta.json ]; then
              cp -f /var/www/updates/latest-beta.json "/var/www/updates/releases/latest-beta.json.bak-${TS}"
            fi

            install -m 0644 "${APK_STAGE}" "${APK_VERSIONED}"
            install -m 0644 "${JSON_STAGE}" "${JSON_VERSIONED}"
            cp -f "${APK_VERSIONED}" /var/www/updates/racenav-beta.apk
            cp -f "${JSON_VERSIONED}" /var/www/updates/latest-beta.json

            curl -k -fsSL https://trophynav.ru/api/update/beta | grep -q "\"versionName\":\"${VERSION_NAME}\""
            curl -k -I -fsSL https://trophynav.ru/updates/racenav-beta.apk | grep -qi '^HTTP/.* 200'
            rm -rf "${STAGE}"

      - name: Create GitHub Release (on tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Trophy Navigator ${{ github.ref_name }}
          files: ./racenav-v${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
